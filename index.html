<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <title>Terragotcha — dev tools (label / colour / zoom editors, audit mode)</title>
    <!--
      THE VANILLA APP, REDUCED TO A DEV-TOOL PAGE (B11).

      The product is the Astro app in apps/web, served at / and /country/*. This
      page is not deployed (build-pages.mjs does not stage it); `npm run dev`
      serves it at /legacy. It exists for the tools nobody ported and nobody
      should: the label, colour and focus-zoom editors — which write
      label-config.json, country-colors.json and country-zoom.json, the files
      both apps read — the superuser audit walkthrough of Daily Challenge
      questions, and the three celebration animations, kept as buttons.

      It drives the SAME engine (js/core) as the Astro app, through the same
      PointerControls, so what an editor saves is what the product shows.

      Rules that still hold here: no new inline logic (js/ modules only), no new
      CSS (a minimal rule in legacy.css is the only place), inline SVG for icons,
      and every root-absolute reference (/js, /legacy.css, /packages, /assets)
      resolves because the dev server serves the repo root.

      Two stylesheets, in this order: the token artefact, then legacy.css — the
      pruned remainder of the old styles.css (B12 commit 3). Names both define
      resolve from legacy.css, so the page looks as it did; names only the token
      build has (--font-body, --globe-space, --globe-border, --globe-label)
      resolve from the artefact, so the engine on this page reads the same
      tokens the product does — the point of an editor is that what it shows is
      what the product shows.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
    <link rel="stylesheet" href="/packages/design-tokens/dist/tokens.css">
    <link rel="stylesheet" href="legacy.css">
</head>
<body>
    <div id="container">
        <button id="zoom-out-btn">🌍 Zoom Out</button>
        <div id="loading">Loading world map data...</div>
        <button id="bounce-btn">Bounce</button>
        <button id="shatter-btn">Shatter</button>
        <button id="pinball-btn">Pinball</button>
        <button id="edit-mode-btn">Edit Labels</button>
        <button id="save-config-btn" style="display: none;">Save Config</button>
        <button id="fine-tune-btn" style="display: none;">Fine Tune</button>
        <button id="edit-colors-btn">Edit Colors</button>
        <button id="save-colors-btn" style="display: none;">Save Colors</button>
        <div id="swatch-panel" style="display: none;"></div>
        <button id="edit-zoom-btn">Edit Zoom</button>
        <button id="save-zoom-btn" style="display: none;">Save Zoom</button>
        <div id="level-panel" style="display: none;"></div>

        <!-- Zoom Level Widget -->
        <div id="zoom-widget">
            <div id="zoom-label-top">Zoom</div>
            <div id="zoom-bar-container">
                <div id="zoom-bar-fill"></div>
            </div>
            <div id="zoom-value">2.5</div>
        </div>

        <!-- Search: the quickest way to put a country under an editor. Shown
             directly: legacy.css hides it until the (deleted) settings panel
             reparented it, and here it is the standalone overlay it was first. -->
        <div id="search-container" style="display: block;">
            <div id="search-box">
                <span id="search-icon">🔍</span>
                <input type="text" id="country-search" placeholder="Search countries...">
            </div>
            <div id="search-results"></div>
        </div>

        <!-- Label Editor Modal -->
        <div id="label-editor-modal" style="display: none;">
            <div id="label-editor-overlay"></div>
            <div id="label-editor-content">
                <h2 id="label-editor-title">Edit Label</h2>
                <div class="label-editor-section">
                    <label>Position Offset X:</label>
                    <input type="range" id="label-offset-x" min="-0.2" max="0.2" step="0.01" value="0">
                    <span id="label-offset-x-value">0.00</span>
                </div>
                <div class="label-editor-section">
                    <label>Position Offset Y:</label>
                    <input type="range" id="label-offset-y" min="-0.2" max="0.2" step="0.01" value="0">
                    <span id="label-offset-y-value">0.00</span>
                </div>
                <div class="label-editor-section">
                    <label>Position Offset Z:</label>
                    <input type="range" id="label-offset-z" min="-0.2" max="0.2" step="0.01" value="0">
                    <span id="label-offset-z-value">0.00</span>
                </div>
                <div class="label-editor-section">
                    <label>Scale:</label>
                    <input type="range" id="label-scale" min="0.1" max="3.0" step="0.1" value="1.0">
                    <span id="label-scale-value">1.0</span>
                </div>
                <div class="label-editor-buttons">
                    <button id="label-reset-btn">Reset to Default</button>
                    <button id="label-editor-close-btn">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!--
      Workspace packages and third-party libraries are resolved by bare specifier
      so the same import statements work here (buildless, native ES modules) and
      later under Astro/Vite/Metro. Must precede any module script that uses them.

      `three` is pinned to the version in package.json — tests/three-version.test.js
      fails the build if the two drift, since nothing else ties the CDN URL to the
      dependency a bundler would install.
    -->
    <script type="importmap">
    {
        "imports": {
            "@terragotcha/quiz-core": "/packages/quiz-core/src/index.js",
            "@terragotcha/quiz-core/": "/packages/quiz-core/src/",
            "@terragotcha/storage": "/packages/storage/src/index.js",
            "@terragotcha/storage/": "/packages/storage/src/",
            "@terragotcha/api-client": "/packages/api-client/src/index.js",
            "@terragotcha/api-client/": "/packages/api-client/src/",
            "@terragotcha/globe-bridge": "/packages/globe-bridge/src/index.js",
            "@terragotcha/globe-bridge/": "/packages/globe-bridge/src/",
            "@terragotcha/design-tokens": "/packages/design-tokens/src/index.js",
            "@terragotcha/design-tokens/": "/packages/design-tokens/src/",
            "zustand/vanilla": "https://cdn.jsdelivr.net/npm/zustand@5.0.15/esm/vanilla.mjs",
            "three": "https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.module.js",
            "three/": "https://cdn.jsdelivr.net/npm/three@0.128.0/"
        }
    }
    </script>
    <script type="module">
        // ===== IMPORTS =====
        // The engine, shared with apps/web: js/core, js/data, js/utils.
        import { state } from './js/data/state.js';
        import { SceneManager } from './js/core/scene.js';
        import { GlobeManager } from './js/core/globe.js';
        import { LabelManager } from './js/core/labels.js';
        import { CameraController } from './js/core/camera-controls.js';
        import { installContextRecovery } from './js/core/context-recovery.js';
        import { FocusZoomRegistry } from './js/core/focus-zoom.js';
        import { PointerControls } from './js/core/pointer-controls.js';
        import { SmallCountryIndicator } from './js/core/small-country-indicator.js';
        import { countryData, countryToISO } from './js/data/country-data.js';
        import { LARGE_COUNTRIES, SMALL_COUNTRIES } from './js/data/country-sizes.js';
        import { createCountryTable } from './js/data/country-table.js';
        import { createWebGlobeBridge } from './js/data/globe-bridge.js';
        import { ApiClient, AUDIT_TOKEN_KEY } from './js/data/api-client.js';
        import { elements } from './js/utils/dom.js';
        // The dev tools themselves — everything left of js/features after B11.
        import { LabelEditor } from './js/features/label-editor.js';
        import { ColorEditor } from './js/features/color-editor.js';
        import { ZoomEditor } from './js/features/zoom-editor.js';
        import { BounceAnimation } from './js/features/bounce-animation.js';
        import { ShatterAnimation } from './js/features/shatter-animation.js';
        import { PinballAnimation } from './js/features/pinball-animation.js';
        import { SearchManager } from './js/features/search.js';
        import { updateZoomWidget, updateZoomOutButtonVisibility } from './js/features/ui-sync.js';
        import { hideLoading } from './js/features/loading.js';
        import { showWebGLFallback } from './js/features/webgl-fallback.js';

        let scene, camera, renderer, globe;
        let controls;
        let initialCameraDistance;

        let smallCountryIndicator = null;
        let bounceAnimation = null;
        let shatterAnimation = null;
        let pinballAnimation = null;
        let labelEditor = null;
        let colorEditor = null;
        let zoomEditor = null;
        let pointerControls = null;
        let focusRegistry = null;

        let sceneManager = null;
        let globeManager = null;
        let labelManager = null;
        let cameraController = null;
        let searchManager = null;
        let auditMode = null;      // superuser audit tool, dynamically imported

        // Superuser audit mode hand-off: the backend's /audit/launch page links
        // here with ?audit=<signed token>. Stash it for the session and strip it
        // from the URL immediately (so it never lingers in the address bar); the
        // audit module itself is only imported once the globe is up (below).
        {
            const auditParam = new URLSearchParams(location.search).get('audit');
            if (auditParam) {
                try { sessionStorage.setItem(AUDIT_TOKEN_KEY, auditParam); } catch (_) { /* no-op */ }
                const params = new URLSearchParams(location.search);
                params.delete('audit');
                const rest = params.toString();
                history.replaceState(null, '', location.pathname + (rest ? `?${rest}` : ''));
            }
        }

        function init() {
            sceneManager = new SceneManager(elements.get('container'));
            sceneManager.init();
            scene = sceneManager.getScene();
            camera = sceneManager.getCamera();
            renderer = sceneManager.getRenderer();
            initialCameraDistance = sceneManager.getInitialCameraDistance();

            globeManager = new GlobeManager(scene);

            // The three editors are mutually exclusive; entering one leaves the others.
            colorEditor = new ColorEditor({
                globeManager,
                onEnter: () => { if (labelEditor.isActive()) labelEditor.toggle(); }
            });
            zoomEditor = new ZoomEditor({
                rotateGlobeToCountry: (arg, q, a) => cameraController.rotateToCountry(arg, q, a),
                onEnter: () => {
                    if (labelEditor.isActive()) labelEditor.toggle();
                    if (colorEditor.isActive()) colorEditor.toggle();
                }
            });

            smallCountryIndicator = new SmallCountryIndicator({ globeManager, smallCountries: SMALL_COUNTRIES });

            globeManager.init();
            globe = globeManager.getGlobe();

            cameraController = new CameraController(camera, renderer, scene);
            cameraController.setupControls();
            controls = cameraController.getControls();
            cameraController.enableAutoRotation();

            globeManager.loadGlobe(
                (percent, message, animated) => {
                    sceneManager.updateLoadingProgress(percent, message, animated, (id) => elements.get(id));
                },
                () => {
                    labelManager = new LabelManager(scene, camera, globeManager);
                    labelManager.createLabels(LARGE_COUNTRIES, SMALL_COUNTRIES);

                    labelEditor = new LabelEditor({
                        scene, camera, controls, labelManager,
                        updateLabelVisibility: () => labelManager.updateVisibility()
                    });

                    // Focus-zoom levels (A–H) by bbox width: drives click/search focus
                    // AND each label's appearance threshold. The zoom editor edits it.
                    focusRegistry = new FocusZoomRegistry();
                    focusRegistry.buildFromCountries(
                        globeManager.getCountryNames().map(n => globeManager.getCountryByName(n)).filter(Boolean));
                    labelManager.applyFocusZoom(focusRegistry);
                    zoomEditor.focusRegistry = focusRegistry;
                    zoomEditor.labelManager = labelManager;

                    searchManager = new SearchManager({
                        elements, globeManager, countryData, countryToISO,
                        rotateGlobeToCountry: (arg, q, a) => cameraController.rotateToCountry(arg, q, a),
                        resetIdleTimer: () => cameraController.resetIdleTimer()
                    });
                    searchManager.init();

                    // Superuser audit mode — only fetched when a token is present.
                    let hasAuditToken = false;
                    try { hasAuditToken = !!sessionStorage.getItem(AUDIT_TOKEN_KEY); } catch (_) { /* no-op */ }
                    if (hasAuditToken) {
                        const apiClient = new ApiClient();
                        const globeBridge = createWebGlobeBridge({ globeManager, cameraController });
                        createCountryTable({ globeManager, countryToISO }); // warms the table the bridge's callers expect
                        import('./js/features/audit/audit-mode.js').then(({ AuditMode }) => {
                            auditMode = new AuditMode({ apiClient, globeBridge, focusRegistry });
                            auditMode.init();
                        }).catch((e) => console.error('Audit mode failed to load', e));
                    }

                    // The three celebrations, as buttons (and B for bounce).
                    bounceAnimation = new BounceAnimation({ globeGroup: globe, camera, renderer, controls });
                    window.bounceGlobe = () => bounceAnimation.start();
                    const oceanColorVec = globeManager.material.uniforms.uOceanColor.value;
                    shatterAnimation = new ShatterAnimation({
                        globeGroup: globe, scene, camera, controls, initialCameraDistance,
                        idBytes: globeManager.idBytes, idW: globeManager.idW, idH: globeManager.idH,
                        paletteBytes: globeManager.paletteDefaults,
                        oceanColor: [
                            Math.round(oceanColorVec.r * 255),
                            Math.round(oceanColorVec.g * 255),
                            Math.round(oceanColorVec.b * 255)
                        ]
                    });
                    pinballAnimation = new PinballAnimation({
                        globeGroup: globe, camera, controls, renderer, initialCameraDistance
                    });

                    // Load the three config files the editors own.
                    sceneManager.updateLoadingProgress(95, 'Loading configuration...', true, (id) => elements.get(id));
                    labelEditor.loadConfig();
                    colorEditor.loadConfig();
                    zoomEditor.loadConfig();

                    // Pointer dispatch — constructed here so every injected editor exists.
                    pointerControls = new PointerControls({
                        camera, controls, renderer,
                        globeManager, labelManager, smallCountryIndicator,
                        labelEditor, colorEditor, zoomEditor,
                        getAuditMode: () => auditMode,
                        rotateGlobeToCountry: (arg, q, a) => cameraController.rotateToCountry(arg, q, a),
                        resetIdleTimer: () => cameraController.resetIdleTimer(),
                        onFlick: (vx, vy) => cameraController.flick(vx, vy),
                        cancelFlick: () => cameraController.cancelFlick(),
                        countryData, countryToISO, state
                    });
                    pointerControls.attach();

                    cameraController.configure({
                        globeManager, labelManager, smallCountryIndicator,
                        searchManager, focusRegistry, initialCameraDistance
                    });

                    sceneManager.fadeInLights();
                    globeManager.fadeInLighting();

                    sceneManager.updateLoadingProgress(100, 'Complete!', true, (id) => elements.get(id));
                    setTimeout(() => requestAnimationFrame(hideLoading), 250);
                },
                (error) => {
                    console.error('Failed to load globe:', error);
                    hideLoading();
                }
            );

            setupEventListeners();
            installContextRecovery(sceneManager, { globeManager });

            sceneManager.onRender(() => {
                cameraController.update();
                if (globeManager) globeManager.updateFlash();
                if (labelManager) labelManager.updateVisibility();
                if (bounceAnimation) bounceAnimation.update();
                if (shatterAnimation) shatterAnimation.update();
                if (pinballAnimation) pinballAnimation.update();
                updateZoomWidget(camera);
                updateZoomOutButtonVisibility(camera);
            });
            sceneManager.start();
        }

        function setupEventListeners() {
            renderer.domElement.addEventListener('wheel', () => cameraController.resetIdleTimer());
            sceneManager.onResize(onWindowResize);
            elements.get('zoom-out-btn').addEventListener('click', () => cameraController.zoomOut());
            window.addEventListener('keydown', onKeyDown);

            // Edit-mode wheel adjusts label size. capture: true so it runs before
            // OrbitControls' bubbling-phase wheel listener; the handler stops
            // propagation only when it consumes the event.
            renderer.domElement.addEventListener('wheel', (e) => labelEditor.onWheel(e), { passive: false, capture: true });

            elements.get('bounce-btn').addEventListener('click', () => { if (bounceAnimation) bounceAnimation.start(); });
            elements.get('shatter-btn').addEventListener('click', () => {
                if (!shatterAnimation) return;
                if (shatterAnimation.running) shatterAnimation.restore(); else shatterAnimation.start();
            });
            elements.get('pinball-btn').addEventListener('click', () => {
                if (!pinballAnimation) return;
                if (pinballAnimation.running) pinballAnimation.restore(); else pinballAnimation.start();
            });

            elements.get('edit-mode-btn').addEventListener('click', () => labelEditor.toggle());
            elements.get('save-config-btn').addEventListener('click', () => labelEditor.saveConfig());
            elements.get('fine-tune-btn').addEventListener('click', () => labelEditor.openModal());

            elements.get('edit-colors-btn').addEventListener('click', () => colorEditor.toggle());
            elements.get('save-colors-btn').addEventListener('click', () => colorEditor.saveConfig());
            colorEditor.buildSwatchPanel();

            elements.get('edit-zoom-btn').addEventListener('click', () => zoomEditor.toggle());
            elements.get('save-zoom-btn').addEventListener('click', () => zoomEditor.saveConfig());
            zoomEditor.buildLevelPanel();

            elements.get('label-editor-close-btn').addEventListener('click', () => labelEditor.closeModal());
            elements.get('label-editor-overlay').addEventListener('click', () => labelEditor.closeModal());
            elements.get('label-reset-btn').addEventListener('click', () => labelEditor.resetSelected());
            elements.get('label-offset-x').addEventListener('input', () => labelEditor.onOffsetChange());
            elements.get('label-offset-y').addEventListener('input', () => labelEditor.onOffsetChange());
            elements.get('label-offset-z').addEventListener('input', () => labelEditor.onOffsetChange());
            elements.get('label-scale').addEventListener('input', () => labelEditor.onScaleChange());
        }

        // E toggles the label editor, S saves it, B bounces.
        function onKeyDown(event) {
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;
            if (event.key === 'e' || event.key === 'E') {
                labelEditor.toggle();
            } else if (event.key === 's' || event.key === 'S') {
                if (labelEditor.isActive()) labelEditor.saveConfig();
            } else if (event.key === 'b' || event.key === 'B') {
                if (bounceAnimation) bounceAnimation.start();
            }
        }

        // SceneManager has already resized the renderer/camera and recomputed the
        // distance for the settled viewport; move the camera to it, keeping the view.
        function onWindowResize() {
            const direction = camera.position.clone().normalize();
            camera.position.copy(direction.multiplyScalar(sceneManager.getInitialCameraDistance()));
            camera.position.y = 0;
            camera.lookAt(0, 0, 0);
            controls.update();
        }

        // A synchronous start-up failure — chiefly a WebGL context the browser
        // refuses to create — would otherwise leave the page half-started with
        // no explanation.
        try {
            init();
        } catch (err) {
            showWebGLFallback(err);
        }
    </script>
</body>
</html>
