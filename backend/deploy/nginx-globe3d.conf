# nginx server block for the Globe3D API.
# Install: sudo cp backend/deploy/nginx-globe3d.conf /etc/nginx/sites-available/globe3d.conf
#          sudo ln -s /etc/nginx/sites-available/globe3d.conf /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
#          sudo certbot --nginx -d globe-api.example.com
#
# certbot rewrites this block in place to add the :443 listener, the
# ssl_certificate lines, and an http->https redirect. The version below is the
# pre-certbot (plain :80) form.

upstream globe3d_app {
    server unix:/run/globe3d.sock;
}

server {
    listen 80;
    listen [::]:80;
    server_name globe-api.example.com;

    # Keep request bodies small — the API only takes tiny JSON payloads.
    client_max_body_size 256k;

    # Collected Django static (admin + DRF browsable API + stats/ dashboards).
    # WhiteNoise can also serve these; this just lets nginx do it directly.
    location /static/ {
        alias /srv/globe3d/app/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    location / {
        proxy_pass http://globe3d_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # settings.SECURE_PROXY_SSL_HEADER trusts this to detect HTTPS.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
