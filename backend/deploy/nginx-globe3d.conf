# nginx server block for the Globe3D API — Cloudflare proxied (orange cloud).
#
# Traffic path: visitor --HTTPS--> Cloudflare edge --HTTPS--> this origin --> gunicorn.
# Cloudflare runs in "Full (strict)" mode, so the origin presents a Cloudflare
# Origin Certificate (15-yr, no renewals — no certbot). The origin only ever sees
# Cloudflare, and the firewall (see deploy/cf-allowlist.sh) only admits Cloudflare
# IP ranges on 443, so there is no public :80 here — Cloudflare's "Always Use
# HTTPS" upgrades http at the edge.
#
# Install:
#   sudo install -d -m 0750 /etc/ssl/cloudflare
#   # place the Origin Cert + key from the Cloudflare dashboard:
#   #   /etc/ssl/cloudflare/api.terragotcha.com.pem   (cert, 0644 root)
#   #   /etc/ssl/cloudflare/api.terragotcha.com.key   (key,  0640 root)
#   sudo cp /srv/globe3d/backend/deploy/nginx-globe3d.conf /etc/nginx/sites-available/globe3d.conf
#   sudo ln -s /etc/nginx/sites-available/globe3d.conf /etc/nginx/sites-enabled/
#   sudo /srv/globe3d/backend/deploy/cf-allowlist.sh   # writes realip conf + ufw rules
#   sudo nginx -t && sudo systemctl reload nginx

upstream globe3d_app {
    server unix:/run/globe3d/globe3d.sock;
}

server {
    # HTTP/2 via the listen parameter (the standalone `http2 on;` directive needs
    # nginx >= 1.25.1; Ubuntu 24.04 ships 1.24).
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.terragotcha.com;

    # Cloudflare Origin Certificate (trusted by Cloudflare; valid because the
    # edge connects in Full (strict) and validates this cert for the hostname).
    ssl_certificate     /etc/ssl/cloudflare/api.terragotcha.com.pem;
    ssl_certificate_key /etc/ssl/cloudflare/api.terragotcha.com.key;

    # Recover the visitor's real IP from Cloudflare's CF-Connecting-IP header.
    # Generated by deploy/cf-allowlist.sh (set_real_ip_from <CF ranges> + header).
    include /etc/nginx/conf.d/cloudflare-realip.conf;

    # Strongest origin lock: Authenticated Origin Pulls (mTLS) — only Cloudflare,
    # presenting its origin-pull client cert, can complete the TLS handshake (even
    # from an allowed IP). Requires the matching toggle ON in the Cloudflare
    # SSL/TLS → Origin Server → Authenticated Origin Pulls dashboard, and the
    # Cloudflare origin-pull CA installed at the path below (see deploy/README.md).
    ssl_client_certificate /etc/ssl/cloudflare/origin-pull-ca.pem;
    ssl_verify_client on;

    # The API only takes tiny JSON payloads.
    client_max_body_size 256k;

    # Collected Django static (admin + DRF browsable API + stats/ dashboards).
    location /static/ {
        alias /srv/globe3d/backend/staticfiles/;
        access_log off;
        expires 30d;
    }

    # Monitoring endpoints are reachable ONLY via the IP-allowlisted metrics vhost
    # (deploy/monitoring/nginx-metrics.conf) — never through Cloudflare/the public
    # edge. Return 404 so their existence isn't advertised here.
    location = /metrics { return 404; }
    location = /healthz { return 404; }

    location / {
        proxy_pass http://globe3d_app;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # nginx terminates 443 here, so $scheme is https — settings'
        # SECURE_PROXY_SSL_HEADER trusts this to mark the request secure.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
