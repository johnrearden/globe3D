# Internal metrics vhost for the Globe3D API.
#
# Exposes ONLY /metrics (django-prometheus) and /healthz, proxied to the gunicorn
# socket, on a dedicated port that the remote Prometheus reaches directly by the
# VPS IP — NOT through Cloudflare. Two independent locks guard it:
#   1. ufw admits :9145 only from the Prometheus server's IP (ufw-metrics.sh).
#   2. the allow/deny below (defense in depth, in case ufw is ever flushed).
# Plaintext HTTP is acceptable here because the link is IP-scoped and carries no
# secrets; front it with TLS/basic-auth if you want extra defense in depth.
#
# Install:
#   sudo cp backend/deploy/monitoring/nginx-metrics.conf /etc/nginx/sites-available/globe3d-metrics.conf
#   sudo ln -s /etc/nginx/sites-available/globe3d-metrics.conf /etc/nginx/sites-enabled/
#   # edit the allow line + Host below, then:
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 9145;
    listen [::]:9145;
    server_name _;

    # Only the monitoring box may read metrics. REPLACE with your Prometheus IP.
    allow 203.0.113.10;
    deny all;

    access_log off;

    # Django validates the Host against DJANGO_ALLOWED_HOSTS (api.terragotcha.com
    # in prod). A scrape to http://<vps-ip>:9145 would otherwise be a 400
    # DisallowedHost, so force a known-allowed Host. Keep this in sync with
    # DJANGO_ALLOWED_HOSTS. No X-Forwarded-Proto is set, so Django treats the
    # request as plain http — fine, /metrics and /healthz don't redirect.
    location = /metrics {
        proxy_pass http://unix:/run/globe3d/globe3d.sock;
        proxy_set_header Host api.terragotcha.com;
    }
    location = /healthz {
        proxy_pass http://unix:/run/globe3d/globe3d.sock;
        proxy_set_header Host api.terragotcha.com;
    }

    location / { return 404; }
}
