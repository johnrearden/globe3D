name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.12+ is Astro 7's floor (apps/web). The rest of the repo is happy
          # on 20, but `npm ci` installs every workspace, so the whole job has to
          # clear the highest engine requirement in the tree.
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
